<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14110e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Athletic Meriti · Check-in</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff7f0;--card:#ffffff;--tx:#2a1a10;--mut:#8a7565;--acc:#f26a1b;--accd:#c9500c;--ok:#1f9d55;--okbg:#e3f6ea;--bl:#2f6fed;--blbg:#e5edff;--bd:#f0dfd1;--err:#d33;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17110c;--card:#241a13;--tx:#fbefe5;--mut:#b09a89;--acc:#ff8238;--accd:#ff9a5c;--ok:#4cd387;--okbg:#17321f;--bl:#7aa2ff;--blbg:#1a2646;--bd:#3a2b20;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17110c;--card:#241a13;--tx:#fbefe5;--mut:#b09a89;--acc:#ff8238;--accd:#ff9a5c;--ok:#4cd387;--okbg:#17321f;--bl:#7aa2ff;--blbg:#1a2646;--bd:#3a2b20;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.ball{font-size:30px}
.clock{text-align:right;font-size:13px;color:var(--mut)}
.clock b{display:block;font-size:22px;color:var(--tx)}
.tabs{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:600 15px inherit;font-family:inherit;padding:12px;border-radius:10px;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px}
.stat span{font-size:12px;color:var(--mut)}
input,select{width:100%;font:16px inherit;font-family:inherit;padding:13px 14px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);outline:none}
input:focus,select:focus{border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.st{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:14px 8px;text-align:center;cursor:pointer;font-family:inherit;color:var(--tx);transition:transform .1s}
.st:active{transform:scale(.96)}
.av{width:56px;height:56px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff;background:var(--acc)}
.st .n{font-weight:700;font-size:15px;line-height:1.2}
.st .t{font-size:12px;color:var(--mut);margin-top:2px}
.badge{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--bd);color:var(--mut)}
.st.in{border-color:var(--ok)}.st.in .badge{background:var(--okbg);color:var(--ok)}
.st.out{border-color:var(--bl)}.st.out .badge{background:var(--blbg);color:var(--bl)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}
header{background:#14110e;border-radius:20px;padding:12px 16px;border-bottom:4px solid var(--acc);color:#fff}
.logo{width:58px;height:58px;border-radius:14px;background:#fff;object-fit:cover;flex:none}
.brand small{display:block;font-size:12px;font-weight:600;color:#7ed957;margin-top:2px}
header .clock{color:#c9b8aa}header .clock b{color:#fff}
.btn.wa{background:#25d366;color:#053b1a;text-decoration:none;display:block;text-align:center}
.card h3{margin:0 0 12px;font-size:16px}
.row{display:flex;gap:8px;margin-bottom:10px}
.btn{border:0;border-radius:12px;padding:13px 16px;font:700 15px inherit;font-family:inherit;background:var(--acc);color:#fff;cursor:pointer}
.btn.sec{background:var(--bd);color:var(--tx)}
.btn.red{background:var(--err)}
.btn.sm{padding:8px 12px;font-size:13px}
.btn.full{width:100%}
.li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}
.li:first-of-type{border-top:0}
.li .m{font-size:13px;color:var(--mut)}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.pill.in{background:var(--okbg);color:var(--ok)}.pill.out{background:var(--blbg);color:var(--bl)}
.sub{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
.sub button{white-space:nowrap;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font:600 14px inherit;font-family:inherit;padding:9px 14px;border-radius:99px;cursor:pointer}
.sub button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.empty{text-align:center;color:var(--mut);padding:28px 8px}
#modal{position:fixed;inset:0;background:rgba(20,10,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal.show{display:flex}
.box{background:var(--card);border-radius:22px;padding:22px;width:100%;max-width:340px;text-align:center}
.box h2{margin:0 0 4px;font-size:20px}
.box p{margin:0 0 14px;color:var(--mut);font-size:14px}
.dots{display:flex;justify-content:center;gap:12px;margin-bottom:16px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--acc)}
.dots i.f{background:var(--acc)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{font:700 24px inherit;font-family:inherit;padding:14px 0;border-radius:14px;border:0;background:var(--bg);color:var(--tx);cursor:pointer}
.keys button:active{background:var(--bd)}
.err{color:var(--err);font-size:13px;min-height:18px;margin-bottom:8px;font-weight:600}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
label.chk{display:flex;align-items:center;gap:10px;font-size:15px}
label.chk input{width:22px;height:22px}
.hint{font-size:13px;color:var(--mut);margin:6px 0 0}
</style>
</head>

<script>
const KEY='bball_v1';
let S={students:[],logs:{},pin:'1234',needCode:true,pending:[]};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
let db=null,synced=false,canWrite=true,shadow={students:{},logs:{},pending:{},settings:{}};
const sj=o=>JSON.stringify(o,Object.keys(o).sort());
function flat(){
  const o={students:{},logs:{},pending:{},settings:{main:{pin:S.pin,needCode:S.needCode}}};
  S.students.forEach(x=>o.students[x.id]=x);
  for(const d in S.logs)for(const id in S.logs[d])o.logs[d+'_'+id]=Object.assign({day:d,sid:id},S.logs[d][id]);
  S.pending.forEach(x=>o.pending[x.id]=x);
  return JSON.parse(JSON.stringify(o));
}
function dbErr(e){toast(e&&e.code==='invalid_argument'?'Sem permissão para editar neste aparelho':'Erro ao sincronizar');}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(!db||!synced)return;
  const cur=flat();
  for(const c in cur){
    for(const k in cur[c]){if(!shadow[c][k]||sj(cur[c][k])!==sj(shadow[c][k]))db.doc(c+'/'+k).set(cur[c][k]).catch(dbErr);}
    for(const k in shadow[c]){if(!(k in cur[c]))db.doc(c+'/'+k).delete().catch(dbErr);}
  }
  shadow=cur;
}
function setMode(){
  $('#mode').textContent=db?(canWrite?'☁️ Sincronizado entre aparelhos':'👀 Somente leitura: peça acesso de Contribuidor'):'📴 Modo local: dados só neste aparelho';
}
function refresh(){if(view==='admin'&&(aTab==='cad'||aTab==='cfg'))return;render();}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const dkey=(d=new Date())=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const hm=t=>{const d=new Date(t);return p2(d.getHours())+':'+p2(d.getMinutes())};
const dur=(a,b)=>{const m=Math.max(0,Math.round((b-a)/60000));return m<60?m+' min':Math.floor(m/60)+'h'+p2(m%60)};
const COLORS=['#f26a1b','#2f6fed','#1f9d55','#a23be0','#d6336c','#0c8f9e','#c98a00'];
const colorOf=id=>COLORS[[...id].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];
let view='kiosk',unlocked=false,q='',aTab='hoje',hDate=dkey(),delId=null,pad=null,tt,newPhoto='',editPhoto='';
function avatar(s,z){const st=z?`width:${z}px;height:${z}px;font-size:${Math.round(z/2.5)}px;margin:0;flex:none`:'';
  return s.photo?`<div class="av" style="${st}"><img src="${s.photo}" alt=""></div>`:`<div class="av" style="background:${colorOf(s.id)};${st}">${esc(s.name[0].toUpperCase())}</div>`;}
function normPhone(v){let d=String(v||'').replace(/\D/g,'');if(d.length===10||d.length===11)d='55'+d;return d;}
function readPhoto(f,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d');const m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);cb(c.toDataURL('image/jpeg',0.75));};im.src=r.result;};r.readAsDataURL(f);}
function offerWa(s,ev){
  if(!s.phone)return;
  S.pending.push({id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,4),sid:s.id,ev,ts:Date.now()});save();
}
function waUrl(p,s){
  const t=hm(p.ts);
  const msg=p.ev==='in'?`🏀 Athletic Meriti: ${s.name} chegou ao treino às ${t}.`:`🏀 Athletic Meriti: ${s.name} saiu do treino às ${t}. Até a próxima!`;
  return 'https://wa.me/'+s.phone+'?text='+encodeURIComponent(msg);
}
function openEdit(id){
  const s=S.students.find(x=>x.id===id);if(!s)return;editPhoto=s.photo||'';
  openModal(`<h2>Editar aluno</h2><div style="text-align:left;margin-top:12px"><div class="row" style="align-items:center"><div id="eprev">${avatar(s,56)}</div><label class="btn sec" style="cursor:pointer">Trocar foto<input type="file" id="eph" accept="image/*" style="display:none"></label></div>
  <div class="row"><input id="en" value="${esc(s.name)}"></div><div class="row"><input id="et" value="${esc(s.turma||'')}" placeholder="Turma"></div>
  <div class="row"><input id="ew" inputmode="tel" value="${esc((s.phone||'').replace(/^55/,''))}" placeholder="WhatsApp com DDD"></div></div>
  <button class="btn full" id="esv">Salvar</button><button class="btn sec full" data-k="x" style="margin-top:8px">Cancelar</button>`);
  $('#eph').onchange=e=>{if(e.target.files[0])readPhoto(e.target.files[0],d=>{editPhoto=d;$('#eprev').innerHTML=`<div class="av" style="width:56px;height:56px;margin:0"><img src="${d}" alt=""></div>`;});};
  $('#esv').onclick=()=>{
    const n=$('#en').value.trim();if(!n)return toast('O nome não pode ficar vazio');
    const ph=normPhone($('#ew').value);if($('#ew').value.trim()&&ph.length<12)return toast('WhatsApp inválido: use DDD + número');
    s.name=n;s.turma=$('#et').value.trim();s.phone=ph;s.photo=editPhoto;save();closeModal();render();toast('Aluno atualizado');
  };
}

function status(id,day=dkey()){const l=(S.logs[day]||{})[id];return !l?'none':l.out?'out':'in';}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600);}
function tick(){const d=new Date();$('#clk').textContent=p2(d.getHours())+':'+p2(d.getMinutes());
$('#dt').textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});}
setInterval(tick,15000);tick();

/* ---------- Modal ---------- */
function openModal(html){$('#box').innerHTML=html;$('#modal').classList.add('show');}
function closeModal(){$('#modal').classList.remove('show');pad=null;}
function padHtml(){
  const v=pad.val;
  return `<h2>${esc(pad.title)}</h2><p>${esc(pad.sub)}</p>
  <div class="dots">${[0,1,2,3].map(i=>`<i class="${i<v.length?'f':''}"></i>`).join('')}</div>
  <div class="err" id="perr">${pad.err||''}</div>
  <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}
  <button data-k="x" style="font-size:16px">Cancelar</button><button data-k="0">0</button><button data-k="b">⌫</button></div>`;
}
function openPad(cfg){pad=Object.assign({val:'',err:''},cfg);openModal(padHtml());}
function padKey(k){
  if(!pad)return;
  if(k==='x'){closeModal();return;}
  if(k==='b')pad.val=pad.val.slice(0,-1);
  else if(pad.val.length<4)pad.val+=k;
  pad.err='';
  if(pad.val.length===4){
    if(pad.check(pad.val)){const d=pad.done;closeModal();d();return;}
    pad.val='';pad.err='Código incorreto';
    openModal(padHtml());$('#box').classList.add('shake');setTimeout(()=>$('#box').classList.remove('shake'),300);return;
  }
  openModal(padHtml());
}
function openConfirm(s){
  const st=status(s.id);
  openModal(`${avatar(s,72)}
  <h2>${esc(s.name)}</h2><p>${st==='in'?'Fazer check-out agora?':'Fazer check-in agora?'}</p>
  <button class="btn full" id="okb" style="margin-bottom:8px">${st==='in'?'Sim, estou saindo':'Sim, cheguei!'}</button>
  <button class="btn sec full" data-k="x">Cancelar</button>`);
  $('#okb').onclick=()=>{closeModal();toggle(s.id);};
}
$('#box').addEventListener('click',e=>{const k=e.target.closest('[data-k]');if(!k)return;if(pad)padKey(k.dataset.k);else if(k.dataset.k==='x')closeModal();});

/* ---------- Ações ---------- */
function toggle(id){
  const s=S.students.find(x=>x.id===id);if(!s)return;
  const day=dkey();S.logs[day]=S.logs[day]||{};
  const st=status(id,day);
  if(st==='none'){S.logs[day][id]={in:Date.now()};toast('✅ Check-in feito! Bom treino, '+s.name.split(' ')[0]+' 🏀');offerWa(s,'in');}
  else if(st==='in'){S.logs[day][id].out=Date.now();toast('👋 Check-out feito! Até a próxima, '+s.name.split(' ')[0]);offerWa(s,'out');}
  save();render();
}
function tapStudent(id){
  const s=S.students.find(x=>x.id===id);if(!s)return;
  const st=status(id);
  if(st==='out'){toast('Você já fez check-out hoje 😉');return;}
  if(S.needCode)openPad({title:s.name,sub:st==='in'?'Código para check-out':'Código para check-in',check:c=>c===s.code,done:()=>toggle(id)});
  else openConfirm(s);
}

/* ---------- Telas ---------- */
function kiosk(){
  const list=S.students.filter(s=>s.name.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name));
  const n=S.students.length,inn=S.students.filter(s=>status(s.id)==='in').length,out=S.students.filter(s=>status(s.id)==='out').length;
  const lbl={none:'Ausente',in:'Presente',out:'Saiu'};
  return `<div class="stats"><div class="stat"><b>${inn}</b><span>Na quadra</span></div><div class="stat"><b>${out}</b><span>Já saíram</span></div><div class="stat"><b>${n}</b><span>Cadastrados</span></div></div>
  <input id="q" placeholder="🔍 Buscar seu nome…" value="${esc(q)}" autocomplete="off">
  ${n===0?'<div class="empty">Nenhum aluno cadastrado ainda.<br>Peça ao professor para cadastrar na aba “Professor”.</div>':
  `<div class="grid">${list.map(s=>{const st=status(s.id);return `<button class="st ${st}" data-id="${s.id}">${avatar(s)}<div class="n">${esc(s.name)}</div><div class="t">${esc(s.turma||'')}</div><span class="badge">${lbl[st]}</span></button>`}).join('')}</div>`}`;
}
function admin(){
  const tabs=[['av','Avisos'+(S.pending.length?' ('+S.pending.length+')':'')],['hoje','Hoje'],['hist','Histórico'],['alunos','Alunos'],['cad','+ Cadastrar'],['cfg','Ajustes']];
  let h=`<div class="sub">${tabs.map(t=>`<button data-at="${t[0]}" class="${aTab===t[0]?'on':''}">${t[1]}</button>`).join('')}</div>`;
  if(aTab==='hoje'||aTab==='hist'){
    const day=aTab==='hoje'?dkey():hDate,lg=S.logs[day]||{};
    const rows=S.students.filter(s=>lg[s.id]).sort((a,b)=>lg[a.id].in-lg[b.id].in);
    const absent=S.students.length-rows.length;
    if(aTab==='hist')h+=`<div class="card"><input type="date" id="hd" value="${hDate}"></div>`;
    h+=`<div class="card"><h3>${rows.length} presentes · ${absent} ausentes</h3>`;
    h+=rows.length?rows.map(s=>{const l=lg[s.id];return `<div class="li"><div><b>${esc(s.name)}</b><div class="m">Entrada ${hm(l.in)}${l.out?' · Saída '+hm(l.out)+' · '+dur(l.in,l.out):''}</div></div><span class="pill ${l.out?'out':'in'}">${l.out?'Saiu':'Na quadra'}</span></div>`}).join(''):'<div class="empty">Nenhum registro neste dia.</div>';
    h+='</div>';
    if(aTab==='hoje'&&S.students.some(s=>status(s.id)==='in'))h+=`<button class="btn sec full" id="endAll">Encerrar treino (check-out de todos)</button>`;
  }
  if(aTab==='av'){
    h+=`<div class="card"><h3>Avisos de WhatsApp pendentes (${S.pending.length})</h3>`;
    h+=S.pending.length?S.pending.map(p=>{const s=S.students.find(x=>x.id===p.sid);if(!s)return '';
      return `<div class="li"><div style="display:flex;gap:10px;align-items:center">${avatar(s,40)}<div><b>${esc(s.name)}</b><div class="m">${p.ev==='in'?'Chegou':'Saiu'} às ${hm(p.ts)}</div></div></div><div style="display:flex;gap:6px"><a class="btn sm wa" href="${waUrl(p,s)}" target="_blank" rel="noopener" data-sent="${p.id}">Enviar</a><button class="btn sm sec" data-skip="${p.id}">Dispensar</button></div></div>`}).join(''):'<div class="empty">Nenhum aviso pendente 🎉</div>';
    h+='</div>';
    if(S.pending.length>1)h+='<button class="btn sec full" id="clearAv">Limpar todos os avisos</button>';
    h+='<p class="hint" style="text-align:center">Toque em “Enviar” para abrir o WhatsApp com a mensagem pronta.</p>';
  }
  if(aTab==='alunos'){
    h+=`<div class="card"><h3>${S.students.length} alunos</h3>`;
    h+=S.students.length?[...S.students].sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<div class="li"><div style="display:flex;gap:10px;align-items:center">${avatar(s,44)}<div><b>${esc(s.name)}</b><div class="m">${esc(s.turma||'Sem turma')} · Código <b>${s.code}</b>${s.phone?' · 📱 WhatsApp':''}</div></div></div><div style="display:flex;gap:6px"><button class="btn sm sec" data-ed="${s.id}">Editar</button><button class="btn sm ${delId===s.id?'red':'sec'}" data-del="${s.id}">${delId===s.id?'Confirmar?':'Excluir'}</button></div></div>`).join(''):'<div class="empty">Nenhum aluno ainda.</div>';
    h+='</div>';
  }
  if(aTab==='cad'){
    h+=`<div class="card"><h3>Novo aluno</h3><div class="row"><input id="nn" placeholder="Nome completo"></div>
    <div class="row"><input id="nt" placeholder="Turma / categoria (ex.: Sub-13)"></div>
    <div class="row"><input id="nw" inputmode="tel" placeholder="WhatsApp do responsável (com DDD)"></div>
    <div class="row" style="align-items:center"><div id="prev" class="av" style="margin:0;flex:none;background:var(--bd);color:var(--mut)">${newPhoto?`<img src="${newPhoto}" alt="">`:'📷'}</div><label class="btn sec" style="cursor:pointer">Foto do aluno<input type="file" id="ph" accept="image/*" style="display:none"></label></div>
    <button class="btn full" id="add">Cadastrar aluno</button><p class="hint">Um código de 4 dígitos é gerado automaticamente. Se houver WhatsApp, cada check-in/out gera um aviso na aba Avisos do professor.</p></div>`;
  }
  if(aTab==='cfg'){
    h+=`<div class="card"><h3>Segurança</h3><label class="chk"><input type="checkbox" id="nc" ${S.needCode?'checked':''}> Exigir código do aluno no check-in/out</label>
    <p class="hint">Evita que um colega faça check-in por outro.</p></div>
    <div class="card"><h3>Trocar PIN do professor</h3><div class="row"><input id="np" inputmode="numeric" maxlength="4" placeholder="Novo PIN (4 dígitos)"><button class="btn" id="spin">Salvar</button></div><p class="hint">PIN inicial: 1234</p></div>
    <button class="btn sec full" id="lock">🔒 Sair do modo professor</button>`;
  }
  return h;
}
function render(){
  $('#tA').textContent='Professor'+(S.pending.length?' ('+S.pending.length+')':'');$('#tK').classList.toggle('on',view==='kiosk');$('#tA').classList.toggle('on',view==='admin');
  const a=document.activeElement,keep=a&&a.id==='q';
  $('#app').innerHTML=view==='kiosk'?kiosk():admin();
  if(keep){const i=$('#q');i.focus();i.setSelectionRange(i.value.length,i.value.length);}
}

/* ---------- Eventos ---------- */
$('#tK').onclick=()=>{view='kiosk';render();};
$('#tA').onclick=()=>{
  if(unlocked){view='admin';render();return;}
  openPad({title:'Área do professor',sub:'Digite o PIN de 4 dígitos',check:c=>c===S.pin,done:()=>{unlocked=true;view='admin';aTab=S.pending.length?'av':'hoje';render();}});
};
const app=$('#app');
app.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;render();}});
app.addEventListener('change',e=>{
  if(e.target.id==='hd'){hDate=e.target.value||dkey();render();}
  if(e.target.id==='nc'){S.needCode=e.target.checked;save();toast('Ajuste salvo');}
  if(e.target.id==='ph'&&e.target.files[0])readPhoto(e.target.files[0],d=>{newPhoto=d;$('#prev').innerHTML=`<img src="${d}" alt="">`;});
});
app.addEventListener('click',e=>{
  const sa=e.target.closest('[data-sent]');if(sa){setTimeout(()=>{S.pending=S.pending.filter(p=>p.id!==sa.dataset.sent);save();render();},700);return;}
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.id)return tapStudent(t.dataset.id);
  if(t.dataset.ed)return openEdit(t.dataset.ed);
  if(t.dataset.skip){S.pending=S.pending.filter(p=>p.id!==t.dataset.skip);save();return render();}
  if(t.id==='clearAv'){S.pending=[];save();return render();}
  if(t.dataset.at){aTab=t.dataset.at;delId=null;return render();}
  if(t.dataset.del){
    if(delId===t.dataset.del){S.students=S.students.filter(s=>s.id!==delId);delId=null;save();toast('Aluno excluído');}else delId=t.dataset.del;
    return render();
  }
  if(t.id==='add'){
    const n=$('#nn').value.trim();if(!n)return toast('Digite o nome do aluno');
    const ph=normPhone($('#nw').value);if($('#nw').value.trim()&&ph.length<12)return toast('WhatsApp inválido: use DDD + número');
    let c;do{c=String(Math.floor(1000+Math.random()*9000));}while(S.students.some(s=>s.code===c));
    S.students.push({id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:n,turma:$('#nt').value.trim(),code:c,photo:newPhoto,phone:ph});newPhoto='';
    save();toast('✅ '+n+' cadastrado! Código: '+c);$('#nn').value='';$('#nt').value='';$('#nw').value='';$('#prev').innerHTML='📷';return;
  }
  if(t.id==='endAll'){const day=dkey();S.students.forEach(s=>{if(status(s.id)==='in')S.logs[day][s.id].out=Date.now();});save();toast('Treino encerrado');return render();}
  if(t.id==='spin'){const v=$('#np').value;if(!/^\d{4}$/.test(v))return toast('O PIN precisa ter 4 números');S.pin=v;save();$('#np').value='';return toast('PIN atualizado');}
  if(t.id==='lock'){unlocked=false;view='kiosk';return render();}
});
render();setMode();
(async()=>{
  try{
    if(!window.claude||!claude.use)return;
    const d=await claude.use('db');if(!d)return;
    try{const u=await claude.use('user');if(u&&u.can){const w=await u.can('data.write');if(w===false)canWrite=false;}}catch(e){}
    db=d;setMode();
    const first={};
    const sub=(c,apply)=>db.collection(c).onSnapshot(snap=>{
      const m={};snap.docs.forEach(x=>{m[x.id]=JSON.parse(JSON.stringify(x.data()))});
      shadow[c]=m;apply(m);first[c]=1;
      if(Object.keys(first).length===4)synced=true;
      try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
      refresh();
    },e=>{if(e&&e.code==='revoked'){db=null;synced=false;setMode();}});
    sub('students',m=>{S.students=Object.values(m);});
    sub('logs',m=>{const L={};for(const k in m){const l=m[k];if(!l.day||!l.sid)continue;(L[l.day]=L[l.day]||{})[l.sid]=l.out?{in:l.in,out:l.out}:{in:l.in};}S.logs=L;});
    sub('pending',m=>{S.pending=Object.values(m).sort((a,b)=>a.ts-b.ts);});
    sub('settings',m=>{if(m.main){S.pin=m.main.pin||S.pin;S.needCode=m.main.needCode!==false;}});
  }catch(e){}
})();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
